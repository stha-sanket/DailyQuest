<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyQuest - Simple Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
          <h1 class="brand-title">DailyQuest</h1>
          <p class="brand-subtitle">Simple, minimal daily habit tracker</p>
        </div>
      </div>
      <div id="today-date" class="date-badge"></div>
    </header>

    <!-- Section 1: Add New Habit -->
    <section class="card">
      <h2 class="card-title">1. Add a Habit</h2>
      <form id="add-habit-form" class="habit-form">
        <input type="text" id="habit-name" class="form-input" placeholder="e.g., Drink 2L Water, Read 10 pages..." required>
        <button type="submit" class="btn btn-primary">+ Add Habit</button>
      </form>
    </section>

    <!-- Section 2: Today's Routine Checklist -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">2. Today's Checklist</h2>
        <span id="progress-text" class="progress-badge">0 / 0 (0%)</span>
      </div>

      <div class="progress-container">
        <progress id="progress-bar" value="0" max="100"></progress>
      </div>

      <div id="today-checklist-container">
        <!-- Generated checklist items will be inserted here -->
      </div>
    </section>

    <!-- Section 3: Notion-Style Weekly / Daily Grid Table -->
    <section class="card">
      <h2 class="card-title">3. Habit Database (Notion-Style Table View)</h2>
      <p class="card-subtitle">Columns represent your habits; rows represent dates.</p>
      <div class="table-container">
        <table class="notion-table" id="habits-table">
          <thead>
            <tr id="table-header-row">
              <th>Date</th>
              <!-- Habit headers will be inserted here dynamically -->
              <th>Daily Progress</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Date rows with checkboxes will be inserted here dynamically -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Section 4: Manage Habits List -->
    <section class="card">
      <h2 class="card-title">4. Manage Habits</h2>
      <ul id="manage-habits-list" class="manage-list">
        <!-- List of existing habits with delete buttons -->
      </ul>
    </section>
  </main>

  <script>
    // --- Data Storage Keys ---
    const STORAGE_KEY_HABITS = 'dailyquest_habits';
    const STORAGE_KEY_LOGS = 'dailyquest_logs'; // format: { 'YYYY-MM-DD': { habitId: true/false } }

    // --- State Initialization ---
    // Default initial habits if none exist
    let habits = JSON.parse(localStorage.getItem(STORAGE_KEY_HABITS)) || [
      { id: 'h1', name: 'Drink 2L Water' },
      { id: 'h2', name: 'Read 15 Mins' },
      { id: 'h3', name: 'Workout / Walk' }
    ];

    let logs = JSON.parse(localStorage.getItem(STORAGE_KEY_LOGS)) || {};

    // Helper: format Date to YYYY-MM-DD
    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    const todayStr = getTodayString();
    if (!logs[todayStr]) {
      logs[todayStr] = {};
    }

    // Helper: save to localStorage
    function saveData() {
      localStorage.setItem(STORAGE_KEY_HABITS, JSON.stringify(habits));
      localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(logs));
    }

    // Helper: calculate progress for a date
    function getProgressForDate(dateStr) {
      if (habits.length === 0) return { completed: 0, total: 0, percentage: 0 };
      const dateLog = logs[dateStr] || {};
      let completed = 0;
      habits.forEach(h => {
        if (dateLog[h.id]) completed++;
      });
      const percentage = Math.round((completed / habits.length) * 100);
      return { completed, total: habits.length, percentage };
    }

    // --- Render Functions ---

    function renderDateHeader() {
      const dateDisplay = document.getElementById('today-date');
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      dateDisplay.textContent = `Today: ${new Date().toLocaleDateString(undefined, options)} (${todayStr})`;
    }

    function renderTodayChecklist() {
      const container = document.getElementById('today-checklist-container');
      container.innerHTML = '';

      if (habits.length === 0) {
        container.innerHTML = '<div class="empty-state">No habits added yet. Use the form above to add your first habit!</div>';
        updateProgress();
        return;
      }

      const ul = document.createElement('ul');
      ul.className = 'checklist';
      habits.forEach(habit => {
        const li = document.createElement('li');
        li.className = 'checklist-item';
        const isDone = !!(logs[todayStr] && logs[todayStr][habit.id]);
        if (isDone) {
          li.classList.add('completed');
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'checklist-checkbox';
        checkbox.id = `check-${habit.id}`;
        checkbox.checked = isDone;
        checkbox.addEventListener('change', () => toggleHabit(todayStr, habit.id, checkbox.checked));

        const label = document.createElement('label');
        label.className = 'checklist-label';
        label.htmlFor = `check-${habit.id}`;
        label.textContent = habit.name;

        li.appendChild(checkbox);
        li.appendChild(label);
        ul.appendChild(li);
      });
      container.appendChild(ul);

      updateProgress();
    }

    function updateProgress() {
      const { completed, total, percentage } = getProgressForDate(todayStr);
      document.getElementById('progress-text').textContent = `${completed} / ${total} (${percentage}%)`;
      const progressBar = document.getElementById('progress-bar');
      progressBar.value = percentage;
    }

    function renderTable() {
      const theadRow = document.getElementById('table-header-row');
      const tbody = document.getElementById('table-body');

      // Clear existing dynamic columns
      theadRow.innerHTML = '<th style="min-width: 140px;">Date</th>';
      habits.forEach(h => {
        const th = document.createElement('th');
        th.style.textAlign = 'center';
        th.textContent = h.name;
        theadRow.appendChild(th);
      });
      const progressTh = document.createElement('th');
      progressTh.style.textAlign = 'center';
      progressTh.textContent = 'Daily Progress';
      theadRow.appendChild(progressTh);

      // Render rows for the last 5 days up to today
      tbody.innerHTML = '';
      const datesToDisplay = [];
      for (let i = 0; i < 5; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        datesToDisplay.push(`${y}-${m}-${day}`);
      }

      datesToDisplay.forEach(dateStr => {
        const tr = document.createElement('tr');

        // Date Cell
        const dateTd = document.createElement('td');
        if (dateStr === todayStr) {
          dateTd.innerHTML = `<span class="date-cell">${dateStr} <span class="date-today-badge">Today</span></span>`;
        } else {
          dateTd.innerHTML = `<span class="date-cell">${dateStr}</span>`;
        }
        tr.appendChild(dateTd);

        // Habit Checkboxes
        habits.forEach(h => {
          const td = document.createElement('td');
          td.className = 'grid-check-cell';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = !!(logs[dateStr] && logs[dateStr][h.id]);
          checkbox.addEventListener('change', () => toggleHabit(dateStr, h.id, checkbox.checked));
          td.appendChild(checkbox);
          tr.appendChild(td);
        });

        // Progress Cell
        const progTd = document.createElement('td');
        progTd.className = 'grid-progress-cell';
        const prog = getProgressForDate(dateStr);
        const isComplete = prog.total > 0 && prog.completed === prog.total;
        progTd.innerHTML = `<span class="grid-progress-pill ${isComplete ? 'complete' : ''}">${prog.completed}/${prog.total} (${prog.percentage}%)</span>`;
        tr.appendChild(progTd);

        tbody.appendChild(tr);
      });
    }

    let editingHabitId = null;

    function renderManageHabits() {
      const list = document.getElementById('manage-habits-list');
      list.innerHTML = '';

      if (habits.length === 0) {
        list.innerHTML = '<li>No habits available to manage.</li>';
        return;
      }

      habits.forEach(habit => {
        const li = document.createElement('li');

        if (editingHabitId === habit.id) {
          // Inline edit form
          const nameInput = document.createElement('input');
          nameInput.type = 'text';
          nameInput.value = habit.name;

          const saveBtn = document.createElement('button');
          saveBtn.textContent = 'Save';
          saveBtn.type = 'button';
          saveBtn.addEventListener('click', () => {
            const newName = nameInput.value.trim();
            if (!newName) {
              alert('Habit name cannot be empty');
              return;
            }
            updateHabit(habit.id, newName);
          });

          const cancelBtn = document.createElement('button');
          cancelBtn.textContent = 'Cancel';
          cancelBtn.type = 'button';
          cancelBtn.addEventListener('click', () => {
            editingHabitId = null;
            renderManageHabits();
          });

          li.appendChild(document.createTextNode('Edit: '));
          li.appendChild(nameInput);
          li.appendChild(document.createTextNode(' '));
          li.appendChild(saveBtn);
          li.appendChild(document.createTextNode(' '));
          li.appendChild(cancelBtn);
        } else {
          const textSpan = document.createElement('span');
          textSpan.textContent = `${habit.name} `;
          li.appendChild(textSpan);

          const editBtn = document.createElement('button');
          editBtn.textContent = 'Edit';
          editBtn.type = 'button';
          editBtn.addEventListener('click', () => {
            editingHabitId = habit.id;
            renderManageHabits();
          });

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.type = 'button';
          deleteBtn.addEventListener('click', () => deleteHabit(habit.id));

          li.appendChild(editBtn);
          li.appendChild(document.createTextNode(' '));
          li.appendChild(deleteBtn);
        }

        list.appendChild(li);
      });
    }

    // --- Action Handlers ---

    function toggleHabit(dateStr, habitId, isChecked) {
      if (!logs[dateStr]) logs[dateStr] = {};
      logs[dateStr][habitId] = isChecked;
      saveData();
      renderTodayChecklist();
      renderTable();
    }

    function addHabit(name) {
      const newHabit = {
        id: 'h_' + Date.now(),
        name: name.trim()
      };
      habits.push(newHabit);
      saveData();
      renderAll();
    }

    function updateHabit(habitId, newName) {
      const habit = habits.find(h => h.id === habitId);
      if (habit) {
        habit.name = newName;
        saveData();
      }
      editingHabitId = null;
      renderAll();
    }

    function deleteHabit(habitId) {
      if (!confirm('Are you sure you want to delete this habit?')) return;
      habits = habits.filter(h => h.id !== habitId);
      if (editingHabitId === habitId) {
        editingHabitId = null;
      }
      // Clean up habit logs
      Object.keys(logs).forEach(date => {
        if (logs[date][habitId] !== undefined) {
          delete logs[date][habitId];
        }
      });
      saveData();
      renderAll();
    }

    function renderAll() {
      renderDateHeader();
      renderTodayChecklist();
      renderTable();
      renderManageHabits();
    }

    // --- Event Listeners ---
    document.getElementById('add-habit-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('habit-name');
      if (input.value.trim()) {
        addHabit(input.value);
        input.value = '';
      }
    });

    // Initial render
    renderAll();
  </script>
</body>
</html>
